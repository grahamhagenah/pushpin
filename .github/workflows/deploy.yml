name: Build and deploy

# Builds Pushpin and publishes it to pushpin.city: the built site is pushed to this repo's gh-pages branch,
# which GitHub Pages serves. Each publish replaces that branch with one new commit, so the repo doesn't grow
# with every build. The code is on main, the default branch, since GitHub runs schedules only from that.
on:
  push:
    branches: [main]
  schedule:
    # GitHub runs schedules on a best-effort basis and often drops runs at :00 and :30, when everyone's
    # cron fires. Odd minutes are quieter. Listings change slowly, so the build itself only runs every three
    # hours (EVENTS_EVERY_HOURS); the runs between check whether it's due and stop.
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      events:
        description: Rebuild now, not only when it's due
        type: boolean
        default: false

permissions:
  contents: write  # Pushing the built site to gh-pages, and the keepalive commit.
  issues: write  # shared/alerts.py opens and closes "Source failing" issues.

# One run at a time. A push cancels a run in progress, since it brings newer code; a scheduled or cron-job.org
# run waits its turn instead, so it never cancels a push's run before the pages are rebuilt.
concurrency:
  group: pages
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Python with what requirements.txt names: Pillow, to cut the film's picture to the size it's shown, and
      # rcssmin and rjsmin, to take the comments out of the pages' styles and scripts. Without them the build still
      # runs, with the picture whole and the pages unminified.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python3 -m pip install -r requirements.txt
      # The readers against saved samples of their sources; a change that breaks one isn't published.
      - run: python3 -m unittest
      - run: python3 -m events.build
        env:
          # A free Ticketmaster Discovery API key, for venues like the Paradise.
          TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY }}
          # Empty means build now. (In GitHub's `a && b || c`, b can't be empty, so the condition is inverted.)
          EVENTS_EVERY_HOURS: ${{ (github.event_name != 'push' && !inputs.events) && '3' || '' }}
      - name: Publish
        if: hashFiles('dist/public/index.html') != ''
        run: |
          echo pushpin.city > dist/public/CNAME
          touch dist/public/.nojekyll
          cd dist/public
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Pushpin, built from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages

      # An issue for any source failing for hours (GitHub emails about it); never holds up the page. A run
      # that didn't rebuild leaves its issues as they are.
      - if: ${{ !cancelled() && hashFiles('dist/public/listings.json') != '' }}
        continue-on-error: true
        run: python3 -m shared.alerts events=dist/public/listings.json
        env:
          GH_TOKEN: ${{ github.token }}

  # GitHub turns off scheduled workflows after 60 days without a commit, which would freeze the site; it
  # disables the whole workflow, so cron-job.org's workflow_dispatch calls would stop working too. If the repo
  # has been quiet for 50 days, an empty commit resets that clock.
  keepalive:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep the scheduled build running"
            git push
          fi
