<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Pushpin</title>
<meta name="color-scheme" content="dark">
<style>html { background: #000; }</style>
<script>
  const path = location.pathname;
  const gone = ["bayarea"].find(slug => path.startsWith("/" + slug + "/") || path === "/" + slug);
  if (gone) location.replace("/" + gone + "/");
  else {
  const city = ["boston", "westernma"].find(slug => path.startsWith("/" + slug + "/"));
  const rest = city ? path.slice(city.length + 2) : "";
  location.replace(!city ? "/boston/" + path.slice(1) + location.search + location.hash
    : rest.startsWith("e/") ? "/" + city + "/?event=" + rest.slice(2).split("/")[0]
    : "/" + city + "/" + location.search + location.hash);
  }
</script>
<p><a href="/" style="color: #fff">Pushpin</a></p>
</html>
