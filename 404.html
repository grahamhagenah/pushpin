<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Pushpin</title>
<meta name="color-scheme" content="dark">
<style>html { background: #000; }</style>
<script>
  const path = location.pathname;
  const gone = ["bayarea"].find(slug => path.startsWith("/" + slug + "/") || path === "/" + slug);
  if (gone) location.replace("/" + gone + "/");
  else {
  const city = ["westernma"].find(slug => path.startsWith("/" + slug + "/"));
  const moved = !city && /^\/boston(\/|$)/.test(path);
  const rest = city ? path.slice(city.length + 2) : path.replace(/^\/(boston\/?)?/, "");
  const home = city ? "/" + city + "/" : "/";
  location.replace(rest.startsWith("e/") ? home + "?event=" + rest.slice(2).split("/")[0]
    : (moved ? "/" + rest : home) + location.search + location.hash);
  }
</script>
<p><a href="/" style="color: #fff">Pushpin</a></p>
</html>
