<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><!-- Pushpin's mark: a white p, its name's first letter, on a black tile, with the amber dot of the i in its name, a pin's head, at its shoulder. Drawn as shapes, not a font's letter, so it's the same everywhere. A tile, filled, so it holds its own in a search result's white circle and a light tab alike, where the dot alone was a speck. --><rect width="24" height="24" rx="5.5" fill="#0a0a0a"/><path fill="#fff" fill-rule="evenodd" d="M6.4 5.8h3.2v1.15A5.1 5.1 0 1 1 9.6 14.85V19.6H6.4ZM12.6 8.45a2.45 2.45 0 1 0 0 4.9a2.45 2.45 0 1 0 0-4.9Z"/><circle cx="18.8" cy="5" r="2.2" fill="#fbbf24"/></svg>
