<html><head><script type="application/ld+json">{"@context":"https://schema.org","@type":"MusicEvent","name":"5Rhythms® Dance Class | 12/5/26","description":"The 5Rhythms® comprise a simple movement practice designed to release the dancer that lives in every body, no matter what its shape, size, age, limitations and experience. This practice itself is simple, there are no steps to follow. We dance not for a mastery of the practice, or to “look good” but for the medicine this practice brings. The class is guided by a certified teacher, who will offer prompts or invitations and/or guided exercises to bring dancers deeper into the practice. We will explore each of the 5 rhythms – Flowing, Staccato, Chaos, Lyrical, and Stillness.\r\n\r\n \r\n\r\nA word about touch, courtesy \u0026 consent\r\n\r\nBy participating in this class you agree to be a partner in co-creating a safe and brave space for our collective dance practice. Since this dance practice is non-verbal, please make eye contact with other dancers before touch. Even if it’s your best friend or partner, on the dance floor we honor sovereignty. Someone may be having a deep experience, some dancers dance with eyes closed or half mast and touch could be disruptive or dis-regulating. On the dance floor, please use your eyes as a means for engagement. After eye contact, if you are not open to touch, please say or signal to your partner that you are not a yes to physical contact (ie; offering a Namaste or arms crossed or by walking away).","image":"https://bombyx.live/wp-content/uploads/2025/03/5Rhythms-1080x1080-1.png","url":"https://bombyx.live","startDate":"2026-12-05 11:00:00T2026-12-05 11:00:00","location":{"@type":"Place","name":"Bombyx","address":"130 Pine Street, Northampton, MA 01062"},"performer":{"@type":"Person","name":"5Rhythms® Dance Class | 12/5/26"}}</script></head><body></body></html>
