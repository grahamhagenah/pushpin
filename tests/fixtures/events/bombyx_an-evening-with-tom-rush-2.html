<html><head><script type="application/ld+json">{"@context":"https://schema.org","@type":"MusicEvent","name":"An Evening with Tom Rush","description":"\u003Cp dir=\u0022auto\u0022\u003E\u003Cstrong\u003ETom Rush\u003C/strong\u003E is a gifted musician and performer, whose shows offer a musical celebration…a journey into the tradition and spectrum of what music has been, can be, and will become. His distinctive guitar style, wry humour and warm, expressive voice have made him both a legend and a lure to audiences around the world. His shows are filled with the rib-aching laughter of terrific story-telling, the sweet melancholy of ballads and the passion of gritty blues.\u003C/p\u003E\r\n\u003Cp dir=\u0022auto\u0022\u003ERush’s impact on the American music scene has been profound. He helped shape the folk revival in the ’60s and the renaissance of the ’80s and ’90s, his music having left its stamp on generations of artists. James Taylor told Rolling Stone, “Tom was not only one of my early heroes, but also one of my main influences.” Country music star Garth Brooks has credited Rush with being one of his top five musical influences. Rush has long championed emerging artists. His early recordings introduced the world to the work of Joni Mitchell, Jackson Browne and James Taylor, and in more recent years his \u003Cstrong\u003EClub 47®\u003C/strong\u003E concerts have brought artists such as Nanci Griffith and Shawn Colvin to wider audiences when they were just beginning to build their own reputations.\u003C/p\u003E\r\n\u003Cp dir=\u0022auto\u0022\u003ETom Rush began his musical career in the early ’60s playing the Boston-area clubs while a Harvard student. The Club 47 was the flagship of the coffee house fleet, and he was soon holding down a weekly spot there, learning from the legendary artists who came to play, honing his skills and growing into his talent. He had released two albums by the time he graduated.\u003C/p\u003E\r\n\u003Cp dir=\u0022auto\u0022\u003ERush displayed then, as he does today, an uncanny knack for finding wonderful songs, and writing his own – many of which have become classics re-interpreted by new generations. (It is a testimony to the universality of his appeal that his songs have been folk hits, country hits, heavy metal and rap hits.) Signed by Elektra in 1965, Rush made three albums for them, culminating in The Circle Game, which, according to Rolling Stone, ushered in the singer/songwriter era.\u003C/p\u003E\r\n\u003Cp dir=\u0022auto\u0022\u003EIn the early ’70s, folk turned to folk-rock, and Rush, ever adaptable, saw more room to stretch out. Recording now for Columbia, he toured tirelessly with a five-man band, playing concerts across the country. Endless promotional tours, interviews, television appearances, and recording sessions added up to five very successful but exhausting years, after which Tom decided to take a break and “recharge” his creative side at his New Hampshire farm.\u003C/p\u003E\r\n\u003Cp dir=\u0022auto\u0022\u003ERush returned with a splash in 1981, selling out Boston’s prestigious Symphony Hall in advance. Time off had not only rekindled Rush’s love of music, but it had also re-ignited music audiences’ love of Rush.\u003C/p\u003E\r\n\u003Cp dir=\u0022auto\u0022\u003EHe instinctively knew that his listeners were interested in both the old and the new, and set out to create a musical forum – like the Club 47 of the early ’60s – to allow established artists and newcomers to share the same stage. In 1982, he tried it out at Symphony Hall. The show was such a hit it became an annual event, growing to fill two, then three nights and the Club 47 series was born. Crafting concerts that combined well-known artists such as Bonnie Raitt or Emmylou Harris with (then) unknowns like Alison Krauss or Mark O’ Connor, Rush took the show on the road. From the ’80s to the present day, Club 47 events have filled the nation’s finest halls to rave reviews, and have been broadcast as national specials on PBS and NPR.\u003C/p\u003E","image":"https://bombyx.live/wp-content/uploads/2026/08/120526_Tom-Rush_BOMBYX_1080x1080-1.jpg","url":"https://bombyx.live","startDate":"2026-12-05 19:00:00T2026-12-05 19:00:00","location":{"@type":"Place","name":"Bombyx","address":"130 Pine Street, Northampton, MA 01062"},"performer":{"@type":"Person","name":"An Evening with Tom Rush"}}</script></head><body></body></html>
