<html><head><script type="application/ld+json">{"@context":"https://schema.org","@type":"MusicEvent","name":"Rickie Lee Jones","description":"\u003Cp style=\u0022text-align: center;\u0022\u003E\u003Cspan style=\u0022color: #800080;\u0022\u003E\u003Cstrong\u003E++ Pre-sale: Thursday, August 13 @ 10am ET ++\r\n++ On-sale: Friday, August 14 @ 10am ET  ++\u003C/strong\u003E\u003C/span\u003E\u003C/p\u003E\r\n\u003Cspan style=\u0022font-weight: 400;\u0022\u003E\u003Cstrong\u003ERickie Lee Jones\u003C/strong\u003E is an American musician, storyteller, two-time Grammy winner and eight-time nominee who has been inspiring pop culture for decades, beginning with her star-making self-titled debut and the seminal \u003C/span\u003E\u003Ci\u003E\u003Cspan style=\u0022font-weight: 400;\u0022\u003EPirates\u003C/span\u003E\u003C/i\u003E\u003Cspan style=\u0022font-weight: 400;\u0022\u003E. Named the “premiere song-stylist and songwriter of her generation” by \u003C/span\u003E\u003Ci\u003E\u003Cspan style=\u0022font-weight: 400;\u0022\u003EThe\u003C/span\u003E\u003C/i\u003E \u003Ci\u003E\u003Cspan style=\u0022font-weight: 400;\u0022\u003ENew Yorker\u003C/span\u003E\u003C/i\u003E\u003Cspan style=\u0022font-weight: 400;\u0022\u003E and “The Duchess of Coolsville” by \u003C/span\u003E\u003Ci\u003E\u003Cspan style=\u0022font-weight: 400;\u0022\u003ETime \u003C/span\u003E\u003C/i\u003E\u003Cspan style=\u0022font-weight: 400;\u0022\u003Emagazine, Jones released her Grammy-nominated album \u003C/span\u003E\u003Ci\u003E\u003Cspan style=\u0022font-weight: 400;\u0022\u003EPieces of Treasure\u003C/span\u003E\u003C/i\u003E\u003Cspan style=\u0022font-weight: 400;\u0022\u003E in 2023, a reunion with Russ Titelman, who produced her first two records.  Jones’ celebrated memoir \u003C/span\u003E\u003Ci\u003E\u003Cspan style=\u0022font-weight: 400;\u0022\u003ELast Chance Texaco \u003C/span\u003E\u003C/i\u003E\u003Cspan style=\u0022font-weight: 400;\u0022\u003Ewas named Book of the Year by \u003C/span\u0
